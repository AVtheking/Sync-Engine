services:
  postgres:
    image: postgres:17
    container_name: syncengine-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncengine
    ports:
      - "5434:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncengine"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
